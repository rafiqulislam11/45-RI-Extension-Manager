name: RI Extension Manager CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Automated Validation Test Suite
        run: node tests/test_suite.js

      - name: Execute Full Build Pipeline (PowerShell)
        run: powershell -ExecutionPolicy Bypass -File ./build-pipeline.ps1 -SkipDeploy

      - name: Verify Artifacts Exist
        run: |
          if (!(Test-Path "RI-Extension-Installer.exe")) { throw "Missing RI-Extension-Installer.exe" }
          if (!(Test-Path "Installer/ProScriptRunner_Adobe_DualHost_v1.3.zxp")) { throw "Missing ZXP package" }
          if (!(Test-Path "RI-Extension-Manager-v3.1.0-Release.zip")) { throw "Missing Release ZIP" }
          if (!(Test-Path "CHECKSUMS.txt")) { throw "Missing CHECKSUMS.txt" }
          Write-Host "All build pipeline artifacts verified!"
